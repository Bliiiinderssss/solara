<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com data:; font-src 'self' https://fonts.gstatic.com; connect-src 'none'; object-src 'none'; frame-ancestors 'none';">
  <title>Connexion Admin — Solara</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: var(--ocean-dark);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    /* Subtle background pattern */
    body::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(196,114,74,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(69,123,157,0.1) 0%, transparent 50%);
    }
    .login-container {
      width: 100%; max-width: 420px;
      position: relative; z-index: 1;
      animation: slideUp 0.6s var(--ease-spring) both;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .login-logo {
      text-align: center; margin-bottom: 2.5rem;
    }
    .login-logo a {
      font-family: var(--font-display); font-size: 2rem;
      color: var(--white); text-decoration: none;
    }
    .login-logo a span { color: var(--terra-light); }
    .login-logo p {
      font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-top: 0.4rem;
    }
    .login-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-xl);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: linear-gradient(to right, var(--terra), var(--gold));
    }
    .login-card h2 {
      font-family: var(--font-display); font-size: 1.6rem;
      margin-bottom: 0.4rem; color: var(--ocean);
    }
    .login-card .subtitle {
      font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2rem;
    }

    /* Floating label inputs */
    .login-float {
      position: relative;
      margin-bottom: 1.25rem;
    }
    .login-float input {
      width: 100%;
      padding: 1.35rem 1rem 0.5rem;
      border: none;
      border-bottom: 2px solid var(--beige-dark);
      border-radius: 0;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--dark);
      background: var(--sand);
      outline: none;
      transition: border-color 0.3s var(--ease-out);
    }
    .login-float input:focus { border-color: var(--terra); }
    .login-float input::placeholder { color: transparent; }
    .login-float label {
      position: absolute;
      left: 1rem; top: 50%;
      transform: translateY(-50%);
      font-size: 0.875rem;
      color: var(--ocean-light);
      pointer-events: none;
      transition: all 0.25s var(--ease-out);
    }
    .login-float input:focus + label,
    .login-float input:not(:placeholder-shown) + label {
      top: 0.45rem;
      transform: translateY(0);
      font-size: 0.65rem;
      color: var(--terra);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .password-wrap { position: relative; }
    .password-wrap .toggle-pw {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 0.85rem;
      color: var(--text-muted); padding: 0.2rem;
      transition: color 0.2s;
    }
    .password-wrap .toggle-pw:hover { color: var(--ocean); }

    .login-btn {
      width: 100%; padding: 0.95rem; font-size: 0.95rem;
      border-radius: var(--radius-pill); background: var(--terra);
      color: white; border: none; font-family: var(--font-body);
      font-weight: 500; cursor: pointer;
      transition: all 0.35s var(--ease-spring);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      position: relative; overflow: hidden;
    }
    .login-btn::before {
      content: '';
      position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s var(--ease-out);
    }
    .login-btn:hover::before { left: 100%; }
    .login-btn:hover {
      background: var(--ocean);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow-ocean);
    }
    .login-btn:active { transform: scale(0.97) !important; }
    .login-btn.loading { opacity: 0.7; cursor: wait; }

    .login-error {
      background: rgba(176,74,74,0.06); border: 1px solid rgba(176,74,74,0.15);
      color: var(--danger); border-radius: var(--radius-sm);
      padding: 0.7rem 1rem; font-size: 0.82rem;
      margin-bottom: 1.25rem; display: none;
      align-items: center; gap: 0.5rem;
    }
    .login-error.visible { display: flex; }
    .login-lockout {
      background: rgba(201,168,108,0.08); border: 1px solid rgba(201,168,108,0.2);
      color: var(--gold); border-radius: var(--radius-sm);
      padding: 0.7rem 1rem; font-size: 0.82rem;
      margin-bottom: 1.25rem; display: none;
      align-items: center; gap: 0.5rem;
    }
    .login-lockout.visible { display: flex; }
    .login-footer {
      text-align: center; margin-top: 2rem;
    }
    .login-footer a {
      color: rgba(255,255,255,0.4); font-size: 0.8rem;
      text-decoration: none; transition: color 0.3s;
    }
    .login-footer a:hover { color: var(--terra-light); }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <a href="index.html">Sol<span>ara</span> Pro</a>
      <p>Espace administrateur</p>
    </div>

    <div class="login-card">
      <h2>Connexion</h2>
      <p class="subtitle">Connectez-vous pour acceder au panel d'administration.</p>

      <div class="login-error" id="loginError"></div>
      <div class="login-lockout" id="loginLockout"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="login-float">
          <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
          <label>Email</label>
        </div>
        <div class="login-float">
          <div class="password-wrap">
            <input type="password" id="loginPassword" placeholder="Mot de passe" required autocomplete="current-password">
            <label>Mot de passe</label>
            <button type="button" class="toggle-pw" onclick="togglePassword()">&#128065;</button>
          </div>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">
          Se connecter
        </button>
      </form>
    </div>

    <div class="login-footer">
      <a href="index.html">&larr; Retour au site</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (isAuthenticated()) {
      window.location.href = 'admin.html';
    }

    checkLockoutDisplay();

    function checkLockoutDisplay() {
      var seconds = isLockedOut();
      if (seconds > 0) {
        var el = document.getElementById('loginLockout');
        el.textContent = 'Compte verrouille. Reessayez dans ' + Math.ceil(seconds / 60) + ' minute(s).';
        el.classList.add('visible');
        document.getElementById('loginBtn').disabled = true;
        setTimeout(function() { checkLockoutDisplay(); }, 5000);
      } else {
        document.getElementById('loginLockout').classList.remove('visible');
        document.getElementById('loginBtn').disabled = false;
      }
    }

    function togglePassword() {
      var input = document.getElementById('loginPassword');
      var btn = input.parentElement.querySelector('.toggle-pw');
      if (input.type === 'password') {
        input.type = 'text'; btn.innerHTML = '&#128274;';
      } else {
        input.type = 'password'; btn.innerHTML = '&#128065;';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      var errorEl = document.getElementById('loginError');
      errorEl.classList.remove('visible');

      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        errorEl.textContent = 'Veuillez remplir tous les champs.';
        errorEl.classList.add('visible');
        return;
      }

      var btn = document.getElementById('loginBtn');
      btn.classList.add('loading');
      btn.textContent = 'Connexion en cours...';

      var result = await login(email, password);

      btn.classList.remove('loading');
      btn.textContent = 'Se connecter';

      if (result.success) {
        window.location.href = 'admin.html';
      } else {
        errorEl.textContent = result.error;
        errorEl.classList.add('visible');
        checkLockoutDisplay();
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginPassword').focus();
      }
    }
  </script>
</body>
</html>
